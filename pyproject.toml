[project]
name = "addresszen"
version = "0.2.2"
description = "Explicit Python client for AddressZen"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "AddressZen", email = "support@addresszen.com" }]
keywords = ["address", "address-validation", "address-autocomplete", "usps", "zipcode"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://addresszen.com"
Documentation = "https://docs.addresszen.com/docs/sdks/python"
Repository = "https://github.com/addresszen/feedback"
Issues = "https://github.com/addresszen/feedback/issues"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

# Secure Development Policy Section 6: never resolve a release under 24 hours old.
[tool.uv]
# The one uv version, for local runs and CI (setup-uv reads it). Bump with build-system uv_build.
required-version = "==0.13.9"
exclude-newer = "1 day"

[tool.uv.build-backend]
module-name = "addresszen"
module-root = ""

[dependency-groups]
dev = [
  "datamodel-code-generator==0.100.0",
  "jsonschema==4.26.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["addresszen", "tests", "examples"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: opt-in live API tests against built wheels"]
pythonpath = ["."]
testpaths = ["tests", "../../sdk-tools/python/tests"]
